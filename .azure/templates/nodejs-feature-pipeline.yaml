parameters:
  - name: project
    type: string
  - name: component
    type: string

variables:
  - group: roboshop-secrets
  - name: acrName
    value: ramuacr.azurecr.io
  - name: imageRef
    value: ramuacr.azurecr.io/${{ parameters.project }}/${{ parameters.component }}

jobs:
- job: FeaturePipeline
  pool:
    vmImage: ubuntu-latest

  steps:

  # BLOCK 1 — Checkout
  - checkout: self
    displayName: Checkout code

  # BLOCK 2 — Read version from package.json
  - script: |
      APP_VERSION=$(node -p "require('./package.json').version")
      echo "##vso[task.setvariable variable=APP_VERSION]$APP_VERSION"
      echo "Version read: $APP_VERSION"
    displayName: Read package.json version

  # BLOCK 3 — Sanity check
  - script: |
      echo "Project   → ${{ parameters.project }}"
      echo "Component → ${{ parameters.component }}"
      echo "Version   → $(APP_VERSION)"
      echo "Image     → $(imageRef):$(APP_VERSION)"
    displayName: Print build info

  # BLOCK 4 — Install dependencies
  - script: npm install
    displayName: Install dependencies

  # BLOCK 5 — Unit tests
  - script: npm test
    displayName: Run unit tests
    name: unit_tests
    continueOnError: true

  # BLOCK 6 — Publish test results
  - task: PublishTestResults@2
    displayName: Publish unit test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/test-results.xml'
      failTaskOnFailedTests: true

  # BLOCK 7 — Library scan (npm audit)
  - script: |
      npm audit --audit-level=high
      if [ $? -ne 0 ]; then
        echo "##vso[task.logissue type=error]High/Critical vulnerabilities found in dependencies"
        echo "##vso[task.complete result=Failed;]"
      fi
    displayName: Library vulnerability scan
    name: library_scan
    continueOnError: true

  # BLOCK 9+10 — Login to ACR via service connection
  - task: Docker@2
    displayName: Login to ACR
    inputs:
      command: login
      containerRegistry: acr-service-connection

  # BLOCK 11 — Docker build
  - script: |
      docker build \
        -t $(imageRef):$(APP_VERSION) \
        -t $(imageRef):latest \
        .
    displayName: Build Docker image
    name: build_image

  # BLOCK 12 — Trivy scan
  # - script: |
  #     curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  #     trivy image \
  #       --exit-code 1 \
  #       --severity HIGH,CRITICAL \
  #       --format table \
  #       $(imageRef):$(APP_VERSION)
  #   displayName: Trivy image scan
  #   name: trivy_scan

  # BLOCK 14 — Push to ACR (only if all scans passed)
  - script: |
      docker push $(imageRef):$(APP_VERSION)
      docker push $(imageRef):latest
    displayName: Push image to ACR
    name: push_image
    condition: succeeded()

  # BLOCK 15 — Print image details
  - script: |
      echo "Image pushed successfully"
      echo "$(imageRef):$(APP_VERSION)"
    displayName: Print pushed image info
    condition: succeeded()

  # BLOCK 16 — Slack notification
  - script: |
      STATUS="${{ variables['Agent.JobStatus'] }}"
      if [ "$AGENT_JOBSTATUS" == "Succeeded" ]; then
        EMOJI=":white_check_mark:"
        COLOR="good"
      else
        EMOJI=":x:"
        COLOR="danger"
      fi

      curl -X POST "$(SLACK_WEBHOOK_URL)" \
        -H "Content-Type: application/json" \
        -d "{
          \"text\": \"${EMOJI} *${{ parameters.project }}/${{ parameters.component }}* feature pipeline: *${AGENT_JOBSTATUS}*\",
          \"attachments\": [{
            \"color\": \"${COLOR}\",
            \"fields\": [
              {\"title\": \"Branch\", \"value\": \"$(Build.SourceBranchName)\", \"short\": true},
              {\"title\": \"Commit\", \"value\": \"$(Build.SourceVersion)\", \"short\": true},
              {\"title\": \"Build\", \"value\": \"$(Build.BuildNumber)\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)\", \"short\": false}
            ]
          }]
        }"
    displayName: Slack notification
    condition: always()
    env:
      SLACK_WEBHOOK_URL: $(SLACK_WEBHOOK_URL)
      AGENT_JOBSTATUS: $(Agent.JobStatus)